<!DOCTYPE html>

<meta charset="UTF-8" />
<title>Backgrounds 1.1</title>
<!-- Game backgrounds preview: the real #canvasWrapper / #cloudsLayer markup + the game's
     own background CSS (css/style.css .bg-sky / .bg-sea / .bg-nebula), with a real map
     drawn on top by js/game/Map.js, so it looks exactly like in the game. -->
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/ui.css" />
<link rel="stylesheet" href="../css/cursor.css" />
<style>
  :root{
    --gold:#f0c674;
  }

  html, body{
    margin:0;
    padding:0;
    background:#1E1E1E;
    color:#eee;
    font-family: Arial, sans-serif;
  }

  body{
    padding:30px 34px 50px;
  }

  h1{
    margin:0 0 6px;
    color:var(--gold);
    font-family: Georgia, 'Times New Roman', serif;
  }

  .page-note{
    margin:0 0 22px;
    color:#bbb;
  }

  .section-label{
    margin:0 0 10px;
    color:var(--gold);
    font-size:18px;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .bar-section{
    margin-bottom:34px;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px 26px;
    margin:0 0 14px;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:10px;
    color:#ddd;
    font-weight:bold;
  }
  /* the game's custom select is 400px wide - a bit narrower here */
  .controls .styled-select{
    min-width:240px;
    max-width:240px;
  }

  .stage-hint{
    margin:10px 0 0;
    color:#999;
    font-size:13px;
  }

    from { transform: translateX(-66.6667%); }
    to   { transform: translateX(0); }

  /* 1% = 0.23 s */
  @keyframes stormyFlash {
    0%, 59.9% { opacity: 0; -webkit-mask-position: 0 100%; mask-position: 0 100%; }
    60%       { opacity: 1; -webkit-mask-position: 0 100%; mask-position: 0 100%; }
    60.65%    { opacity: 1; -webkit-mask-position: 0 0; mask-position: 0 0; }

    61.8%     { opacity: .95; }
    63%       { opacity: .35; }
    65%, 100% { opacity: 0; -webkit-mask-position: 0 0; mask-position: 0 0; }
  }

<body>

<h1>Backgrounds 1.1</h1>
<p class="page-note">The game's backgrounds, exactly as in the game (same CSS). Pick a background and a map - the background shows through every empty tile and around the map.</p>

<div class="bar-section">
  <h2 class="section-label">Backgrounds - current + new (marked "new")</h2>

  <div class="controls">
    <label for="backgroundSelect">Background
      <select id="backgroundSelect" class="styled-select">
        <option value="sky">Sky</option>
        <option value="midnight">Midnight Sky</option>
        <option value="nebula">The Nebula</option>
        <option value="stormy">Stormy Sky</option>
      </select>
    </label>
    <label for="mapSelect">Map
      <select id="mapSelect" class="styled-select">
        <option value="">No map (background only)</option>
        <option value="006_adventureMap2.json" selected>Adventure Map II (Islands)</option>
        <option value="007_adventureMap3.json">Adventure Map III (Crossroads)</option>
        <option value="012_adventureMap6.json">Adventure Map VI (Crossroads of Realms)</option>
      </select>
    </label>
    <span id="fpsOut" style="color:#f0c674;font-weight:bold;min-width:70px">FPS: -</span>
    <label for="fxLow"><input type="checkbox" id="fxLow"> UI Effects: Low (static backgrounds)</label>
  </div>

  <!-- same markup as index.html -->
  <div id="canvasWrapper">
    <div id="cloudsLayer" class="bg-sky"></div>
    <div id="gameContainer">
      <canvas id="gameCanvas" width="1230" height="600" style="width:1230px;height:600px"></canvas>
    </div>
  </div>
  <p class="stage-hint">Drag the map to move it, mouse wheel to zoom - same as in the game.</p>
</div>

<script type="module">
  import GameMap from '../js/game/Map.js';

  const wrapper = document.getElementById('gameContainer');
  const clouds = document.getElementById('cloudsLayer');
  const bgSelect = document.getElementById('backgroundSelect');
  const mapSelect = document.getElementById('mapSelect');
  let canvas = document.getElementById('gameCanvas');
  let map = null;

  // same as applyBackground() in js/game/UI.js
  function applyBackground(type) {
    [...clouds.classList].filter(c => c.startsWith('bg-')).forEach(c => clouds.classList.remove(c));
    void clouds.offsetWidth; // restart the animations
    clouds.classList.add(`bg-${type}`);
  }
  bgSelect.addEventListener('change', () => applyBackground(bgSelect.value));

  // FPS counter (frames per second of the page, updated twice a second)
  const fpsOut = document.getElementById('fpsOut');
  let fpsFrames = 0, fpsStart = performance.now();
  (function fpsTick(now) {
    fpsFrames++;
    if (now - fpsStart >= 500) {
      fpsOut.textContent = 'FPS: ' + Math.round(fpsFrames * 1000 / (now - fpsStart));
      fpsFrames = 0; fpsStart = now;
    }
    requestAnimationFrame(fpsTick);
  })(fpsStart);
  document.getElementById('fxLow').addEventListener('change', e => document.body.classList.toggle('ui-fx-low', e.target.checked));

  async function loadMap(file) {
    // fresh canvas each time - Map.js adds its own drag / zoom listeners to it
    const fresh = canvas.cloneNode(false);
    canvas.replaceWith(fresh);
    canvas = fresh;
    map = null;
    if (!file) return;
    const data = await (await fetch(`../games/${file}`, { cache: 'no-cache' })).json();
    if (mapSelect.value !== file) return; // changed again while loading
    map = new GameMap(canvas, data.maps[0].layout);
  }
  mapSelect.addEventListener('change', () => loadMap(mapSelect.value));

  // redraw every frame like the game (portals / trees animate)
  const ctx = () => canvas.getContext('2d');
  (function frame() {
    if (map) map.render(ctx());
    else ctx().clearRect(0, 0, canvas.width, canvas.height);
    requestAnimationFrame(frame);
  })();

  loadMap(mapSelect.value);
</script>
<script type="module" src="../js/CustomSelect.js"></script>
</body>
